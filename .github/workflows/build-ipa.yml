name: Build Test App IPA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: CascadeDemo unsigned IPA
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build CascadeDemo (unsigned)
        run: |
          xcodebuild build \
            -project CascadePort.xcodeproj \
            -scheme CascadeDemo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          APP_PATH="build/dd/Build/Products/Release-iphoneos/CascadeDemo.app"
          test -d "$APP_PATH"
          rm -rf Payload CascadeDemo-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry CascadeDemo-unsigned.ipa Payload
          ls -lh CascadeDemo-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CascadeDemo-unsigned
          path: CascadeDemo-unsigned.ipa
